[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-company-registry-validator"
version = "1.0.0"
description = "Lightweight validator & format parser for Hong Kong Company Registration Number (CR No.), Business Registration Number (BRN) & UBI under Cap. 622 & Cap. 310."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "HC BUSINESS LIMITED (86HC Compliance Team)", email = "support@86hc.com" }
]
keywords = ["hong-kong", "company-registry", "brn", "ubi", "cr-number", "kyc", "compliance", "86hc"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://www.86hc.com"
"Company Search" = "https://www.86hc.com/company-search"
"BRN Search" = "https://www.86hc.com/business-registration-search"
Repository = "https://github.com/86hc-compliance/hk-company-registry-validator"
